# Local development database for the agent service.
# StoreForge (NestJS + MySQL/MariaDB) runs separately, as it does today.
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped # come back on its own after Docker Desktop restarts
    environment:
      # Local development credentials only
      POSTGRES_USER: revenueops
      POSTGRES_PASSWORD: revenueops
      POSTGRES_DB: revenueops
    ports:
      - "5433:5432" # 5433 so it never clashes with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueops -d revenueops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
