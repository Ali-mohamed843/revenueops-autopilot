name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-service:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports # only adapters/ may know about a specific store
      - run: uv run pytest -v
      # The decision engine decides what may run without a human: every branch must be tested.
      - run: uv run pytest -q tests/test_decision.py tests/test_policies.py --cov=revenueops.decision --cov=revenueops.policies --cov-branch --cov-fail-under=100

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
