[project]
name = "revenueops-agent-service"
version = "0.1.0"
description = "AI agents that find and recover revenue at risk in an e-commerce store"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.12.1",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
revenueops = "revenueops.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "revenueops"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The platform rule: only adapters/ may know about a specific store.
[tool.importlinter]
root_package = "revenueops"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core never imports a specific store adapter"
type = "forbidden"
source_modules = [
    "revenueops.commerce",
    "revenueops.detectors",
    "revenueops.cases",
    "revenueops.agents",
    "revenueops.decision",
    "revenueops.policies",
    "revenueops.pipeline",
]
forbidden_modules = ["revenueops.adapters.storeforge"]

[[tool.importlinter.contracts]]
name = "Adapters don't depend on the core"
type = "forbidden"
source_modules = ["revenueops.adapters"]
forbidden_modules = [
    "revenueops.detectors",
    "revenueops.cases",
    "revenueops.agents",
    "revenueops.pipeline",
]

[[tool.importlinter.contracts]]
name = "The decision engine is pure: no model, database or store"
type = "forbidden"
source_modules = ["revenueops.decision"]
forbidden_modules = [
    "revenueops.agents",
    "revenueops.adapters",
    "revenueops.cases",
    "revenueops.db",
    "revenueops.pipeline",
    "anthropic",
    "httpx",
    "sqlalchemy",
]
